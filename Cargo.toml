[package]
name = "lsm5"
version = "0.1.0"
edition = "2021"
description = "A Log-Structured Merge Tree implementation in Rust"

[[bin]]
name = "lsm5"
path = "src/main.rs"

[lib]
name = "lsm5"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
tempfile = "=3.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
